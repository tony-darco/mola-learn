name: mola

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mola-postgres
    environment:
      POSTGRES_USER: mola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mola
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mola -d mola"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: mola-localstack
    environment:
      SERVICES: s3
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.5
    container_name: mola-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  ingest-worker:
    build: ./ingest
    container_name: mola-ingest-worker
    environment:
      DATABASE_URL: postgres://mola:${POSTGRES_PASSWORD}@postgres:5432/mola
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_BUCKET_RAW: mola-raw
      S3_BUCKET_SAFE: mola-safe
      S3_BUCKET_QUARANTINE: mola-quarantine
      OLLAMA_HOST: http://192.168.1.17:11434
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  clamav-db:
