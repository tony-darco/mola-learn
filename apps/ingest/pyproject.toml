[project]
name = "mola-ingest"
version = "0.1.0"
description = "Mola document ingestion worker (Phase 1, Agent B) — scan/verify, extract, chunk, embed."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "boto3>=1.34",
  "python-magic>=0.4.27",
  "python-docx>=1.1.0",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "clamd>=1.0.2",
]

# Declared as an extra rather than a PEP 735 dependency-group so the documented
# `pip install -e ".[dev]"` actually resolves it — the extras syntax does not
# read [dependency-groups].
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]
