# XcodeGen spec — generates Mola.xcodeproj. This repo does not commit the
# generated project (binary-ish, diffs badly); generate it locally:
#
#   brew install xcodegen
#   cd apps/ipad && xcodegen generate
#   open Mola.xcodeproj
#
# See apps/ipad/README.md for the full setup.
name: Mola
options:
  bundleIdPrefix: com.mola
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2" # iPad only — this is the iPadOS client
    DEVELOPMENT_TEAM: "3R66L49NP5" # tony darco (Personal Team) — free provisioning, installs expire after 7 days
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mola:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Mola
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Mola
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # A real iPad reaches the dev server over the LAN (e.g.
        # http://tonymbp-3.local:3000), not localhost.
        NSLocalNetworkUsageDescription: Mola connects to your Mola server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mola.ipad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
